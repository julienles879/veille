services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn veille.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    env_file:
      - .env
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./staticfiles:/static  # ← on change ici
      - ./media:/media
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd

    depends_on:
      - web
