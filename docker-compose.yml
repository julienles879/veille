version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn veille.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - nginx

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static:/static
      - ./media:/media
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - web
