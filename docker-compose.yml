services:
  web:
    build: .
    env_file: .env
    volumes:
      - static_volume:/app/veille/staticfiles
      - media_volume:/app/veille/media
    expose:
      - "8000"
    depends_on:
      - nginx

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/static
      - media_volume:/media
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
